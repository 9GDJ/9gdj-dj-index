name: daily-scrape-update

on:
  schedule:
    - cron: '0 2,14 * * *'   # UTC 02:00 / 14:00 = 北京时间 10:00 / 22:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Scrape new tracks
        run: python scripts/scrape.py

      - name: Classify (single/mashup, zh/en)
        run: python scripts/classify.py

      - name: Clean bad rows
        run: python scripts/clean_bad.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update $(date +%F)"
          git push
